[package]
name = "exergame"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "exergame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"

nokhwa = { version = "0.10", features = ["input-native"] }

ort = { version = "=2.0.0-rc.15", features = ["load-dynamic", "cuda", "rocm", "migraphx"] } # ONNX Runtime library: GPU build in /opt/onnxruntime (container), CPU copy in src-tauri/ort/
libloading = "0.9" # Preloads CUDA/cuDNN libraries (RTLD_GLOBAL) before ort initialization in AppImage builds
tracing = "0.1"
tracing-subscriber = "0.3" # Layer used to track which EP ort actually runs on
ndarray = "0.15"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimize dependencies in dev builds: frame decoding and resize are several
# times slower without it and eat FPS. The crate itself stays debuggable.
[profile.dev.package."*"]
opt-level = 3
