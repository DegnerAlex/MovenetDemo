[package]
name = "tauri-plugin-exergame-camera"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-exergame-camera"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
